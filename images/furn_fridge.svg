  <circle cx="46" cy="126" r="9" fill="#F58B8B" stroke="#D96B6B" stroke-width="2"/>
  <circle cx="66" cy="140" r="7" fill="#8FC9E9" stroke="#6EA9CD" stroke-width="2"/>
