  <path d="M18 80h114" stroke="#9DB5AC" stroke-width="3"/>
  <!-- 门把手 -->
  <g fill="#7C9A8F" stroke="#5E7A70" stroke-width="2">
    <rect x="108" y="30" width="10" height="34" rx="5"/>
    <rect x="108" y="100" width="10" height="50" rx="5"/>
  </g>
  <!-- 门上贴纸与磁贴 -->
