<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 230">
  <defs>
    <linearGradient id="frBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#F1F6F4"/><stop offset="1" stop-color="#D5E2DD"/>
    </linearGradient>
    <linearGradient id="frDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF5F0"/><stop offset="1" stop-color="#C8DED5"/>
    </linearGradient>
  </defs>
  <!-- 柜脚 -->
  <g fill="#8A9C95"><rect x="18" y="216" width="16" height="12" rx="4"/><rect x="116" y="216" width="16" height="12" rx="4"/></g>
  <!-- 机身 -->
  <rect x="10" y="8" width="130" height="210" rx="14" fill="url(#frBody)" stroke="#9DB5AC" stroke-width="3"/>
  <!-- 上冷冻门 -->
  <rect x="18" y="16" width="114" height="62" rx="9" fill="url(#frDoor)" stroke="#9DB5AC" stroke-width="2.5"/>
  <!-- 下冷藏门 -->
