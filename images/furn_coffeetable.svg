    <path d="M112 20h24l-3 15h-18z" fill="#FFFFFF" stroke="#C6B79C" stroke-width="2.5"/>
    <path d="M136 23q9 2 6 8t-8 0" fill="none" stroke="#C6B79C" stroke-width="3"/>
