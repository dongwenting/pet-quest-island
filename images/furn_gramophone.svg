<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 190">
  <defs>
    <linearGradient id="grWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B27C48"/><stop offset="1" stop-color="#6E4322"/>
    </linearGradient>
    <linearGradient id="grHorn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D778"/><stop offset="1" stop-color="#C18725"/>
    </linearGradient>
    <linearGradient id="grHornIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5B18"/><stop offset="1" stop-color="#D9A23C"/>
    </linearGradient>
  </defs>
  <!-- 柜脚 -->
  <g fill="#4E2E16">
    <rect x="22" y="158" width="13" height="24" rx="4"/>
    <rect x="135" y="158" width="13" height="24" rx="4"/>
  </g>
  <!-- 木质机箱：实心 -->
  <rect x="16" y="112" width="138" height="52" rx="8" fill="url(#grWood)" stroke="#4E2E16" stroke-width="3"/>
  <rect x="12" y="104" width="146" height="14" rx="6" fill="#C08A50" stroke="#4E2E16" stroke-width="2.5"/>
  <rect x="24" y="126" width="54" height="28" rx="4" fill="#A9713F" stroke="#633C1E" stroke-width="2"/>
  <circle cx="51" cy="140" r="4.5" fill="#F0C45A" stroke="#A9741E" stroke-width="1.5"/>
  <rect x="88" y="126" width="54" height="28" rx="4" fill="#A9713F" stroke="#633C1E" stroke-width="2"/>
  <circle cx="115" cy="140" r="4.5" fill="#F0C45A" stroke="#A9741E" stroke-width="1.5"/>
  <!-- 唱盘 -->
  <ellipse cx="60" cy="106" rx="36" ry="10" fill="#2F2A28" stroke="#1B1817" stroke-width="2"/>
  <ellipse cx="60" cy="104" rx="11" ry="3.5" fill="#D34B3F"/>
  <ellipse cx="60" cy="104" rx="2.5" ry="1.2" fill="#F8E9C0"/>
  <!-- 喇叭支杆 -->
  <path d="M118 106c6-18 12-28 20-38" fill="none" stroke="#A9741E" stroke-width="9" stroke-linecap="round"/>
  <path d="M118 106c6-18 12-28 20-38" fill="none" stroke="#E8B94A" stroke-width="4" stroke-linecap="round"/>
  <!-- 大喇叭：三层实心椭圆，无镂空 -->
  <g transform="rotate(-24 106 50)">
    <ellipse cx="106" cy="50" rx="54" ry="37" fill="url(#grHorn)" stroke="#A9751C" stroke-width="3"/>
    <ellipse cx="106" cy="50" rx="43" ry="28" fill="url(#grHornIn)" stroke="#8A5B18" stroke-width="2"/>
    <ellipse cx="106" cy="50" rx="32" ry="19" fill="#8A5B18" opacity=".65"/>
    <path d="M70 36c14-12 40-14 58-4-16-4-38-2-52 10z" fill="#FFF1B8" opacity=".6"/>
  </g>
  <!-- 喇叭颈连接 -->
  <path d="M130 72l10 8-8 10-10-8z" fill="#C18725" stroke="#8A5B18" stroke-width="2"/>
</svg>
