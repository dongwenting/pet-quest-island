<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 92">
  <defs>
    <linearGradient id="rbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DCE8"/><stop offset="1" stop-color="#E4B7CE"/>
    </linearGradient>
  </defs>
  <!-- 厚实长绒毯：三层实心椭圆，无镂空 -->
  <ellipse cx="150" cy="50" rx="148" ry="40" fill="#C990AF" opacity=".45"/>
  <ellipse cx="150" cy="46" rx="146" ry="38" fill="url(#rbBody)" stroke="#C58BA9" stroke-width="3"/>
  <ellipse cx="150" cy="43" rx="128" ry="29" fill="#FDECF3" stroke="#E7BFD4" stroke-width="2.5"/>
  <ellipse cx="150" cy="42" rx="96" ry="20" fill="#F7D6E5" opacity=".8"/>
  <!-- 织纹 -->
  <g stroke="#E9B9D0" stroke-width="2.5" opacity=".8">
    <path d="M40 42q12-9 24 0t24 0M212 42q12-9 24 0t24 0"/>
    <path d="M96 58q14-7 28 0t28 0M148 58q14-7 28 0t28 0"/>
  </g>
  <!-- 中央花纹 -->
  <g fill="#FFFFFF" opacity=".85">
    <circle cx="150" cy="40" r="9"/>
    <circle cx="132" cy="40" r="5"/><circle cx="168" cy="40" r="5"/>
    <circle cx="150" cy="27" r="5"/><circle cx="150" cy="53" r="5"/>
  </g>
  <!-- 四周流苏（实心圆点，不做细线镂空） -->
  <g fill="#F3C5DB">
    <circle cx="8" cy="46" r="5"/><circle cx="20" cy="68" r="5"/><circle cx="44" cy="78" r="5"/>
    <circle cx="292" cy="46" r="5"/><circle cx="280" cy="68" r="5"/><circle cx="256" cy="78" r="5"/>
  </g>
</svg>
