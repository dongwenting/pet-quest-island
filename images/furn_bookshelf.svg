  <g fill="#2F6B37" opacity=".55">
    <circle cx="80" cy="9" r="1.6"/><circle cx="80" cy="17" r="1.6"/>
    <circle cx="60" cy="17" r="1.4"/><circle cx="100" cy="13" r="1.4"/>
