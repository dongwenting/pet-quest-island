  <path d="M62 24h36l-5 12H67z" fill="#E8A23A" stroke="#B5701E" stroke-width="2" stroke-linejoin="round"/>
  <rect x="59" y="20" width="42" height="8" rx="3" fill="#F6BD55" stroke="#B5701E" stroke-width="2"/>
