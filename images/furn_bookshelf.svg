<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 230">
  <defs>
    <linearGradient id="bkWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5530"/><stop offset="1" stop-color="#5C361D"/>
    </linearGradient>
    <linearGradient id="bkInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B27A47"/><stop offset="1" stop-color="#96603A"/>
    </linearGradient>
  </defs>
  <!-- 柜脚 -->
  <g fill="#472815">
    <rect x="18" y="214" width="11" height="14" rx="3"/>
    <rect x="131" y="214" width="11" height="14" rx="3"/>
  </g>
  <!-- 柜体：整块实心木板 -->
  <rect x="10" y="42" width="140" height="176" rx="9" fill="url(#bkWood)" stroke="#472815" stroke-width="3"/>
  <rect x="5" y="36" width="150" height="14" rx="6" fill="#7B4A28" stroke="#472815" stroke-width="2.5"/>
